[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-update-apps"
version = "0.1.0"
description = "One command for macOS updates across Homebrew, MAS and selected developer sources"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Namazbek Bekzhanov"}]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
]

[project.scripts]
update-apps = "update_apps:main"

[project.urls]
Repository = "https://github.com/mrnamazbek/update-apps"
Issues = "https://github.com/mrnamazbek/update-apps/issues"

[tool.setuptools]
py-modules = ["update_apps"]
